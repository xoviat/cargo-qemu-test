[package]
name = "qemu-test-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Proc macro behind `qemu-test`: expands one test module into an embedded-test harness (no_std/QEMU) and a libtest-mimic harness (std host)"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
