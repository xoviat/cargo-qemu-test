[package]
name = "cargo-qtest"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run embedded Rust test suites (embedded-test harness) under QEMU on cross targets such as thumbv7em-none-eabihf"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "qemu", "embedded", "no_std", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
repository = "https://example.invalid/cargo-qtest"

[[bin]]
name = "cargo-qtest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
libtest-mimic = "0.8"
object = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = "0.1"

[dev-dependencies]
