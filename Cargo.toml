[package]
name = "cargo-qemu-test"
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
description = "Run embedded Rust test suites (embedded-test harness) under QEMU on cross targets such as thumbv7em-none-eabihf"
license = "MIT OR Apache-2.0"
keywords = ["cargo", "qemu", "embedded", "no_std", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]
repository = "https://github.com/xoviat/cargo-qemu-test"

[[bin]]
name = "cargo-qtest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
defmt-decoder = "1"
libtest-mimic = "0.8"
object = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = "0.1"
# Fetches the QEMU download script from the latest kokroo/qemu release.
# rustls only: no system TLS libraries, no async runtime.
ureq = { version = "3.5", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[target.'cfg(not(windows))'.dev-dependencies]
defmt = { version = "1", features = ["encoding-raw"] }

[workspace]
# qemu-test + qemu-test-macros ship with cargo-qtest and are built/tested by the
# root `cargo test`. The example firmware crates stay standalone (they have their
# own lockfiles and build for cross targets).
members = ["qemu-test", "qemu-test-macros"]
exclude = ["examples"]
