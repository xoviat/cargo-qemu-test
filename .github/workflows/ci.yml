name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Run host tests (incl. defmt encode/decode roundtrip)
        run: cargo test --verbose

  dual-demo-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run dual-demo on the std host (qemu-test's libtest-mimic harness)
        working-directory: examples/dual-demo
        run: cargo test --verbose

  dual-demo-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run dual-demo under QEMU (qemu-test's embedded-test harness)
        working-directory: examples/dual-demo
        run: |
          cargo qtest --verbose 2>&1 | tee "$RUNNER_TEMP/qtest-dual.log"
          grep -q "shared_cases" "$RUNNER_TEMP/qtest-dual.log"
          grep -q "overflow_fails" "$RUNNER_TEMP/qtest-dual.log"
          grep -q "result: ok" "$RUNNER_TEMP/qtest-dual.log"

  # Xtensa end-to-end: espressif QEMU (fork, patched) + Espressif Rust toolchain.
  # Uses transparent auto-download to fetch and cache prebuilt qemu-system-xtensa.
  xtensa-qemu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        target:
          - xtensa-esp32-none-elf
          - xtensa-esp32s3-none-elf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa (Windows ARM64 via emulation)
        if: matrix.os == 'windows-11-arm'
        run: |
          curl -sLO https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-pc-windows-msvc.zip
          Expand-Archive -Force espup-x86_64-pc-windows-msvc.zip "$HOME\.cargo\bin"
          & "$HOME\.cargo\bin\espup.exe" install --targets esp32,esp32s3
          rustup default esp
      - name: Install Rust for Xtensa
        if: matrix.os != 'windows-11-arm'
        uses: esp-rs/xtensa-toolchain@v1.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32,esp32s3
          ldproxy: false
      - name: Configure Xtensa Environment (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Path "$HOME\.rustup\toolchains\esp" -Recurse -Filter "xtensa-esp32-elf-gcc.exe" | ForEach-Object {
            echo $_.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Install QEMU runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libslirp0 libsdl2-2.0-0
      - name: Install QEMU runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glib libgcrypt libslirp pixman sdl2
      - name: Cache QEMU Xtensa binary
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cargo-qtest
          key: cargo-qtest-xtensa-v0.2.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run xtensa-esp32-demo under QEMU (transparent auto-download)
        working-directory: examples/xtensa-esp32-demo
        continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
        env:
          CARGO_UNSTABLE_BUILD_STD: core
          CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
          CARGO_QTEST_CACHE_DIR: ${{ runner.temp }}/cargo-qtest
        run: |
          cargo qtest --target ${{ matrix.target }} --verbose -- --test-threads=1
      - name: Diagnostics on failure (Windows)
        if: failure() && runner.os == 'Windows'
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'} -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -in 'Error', 'Critical', 'Warning' } | Format-List TimeCreated, ProviderName, Id, Message


  riscv-qemu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf
      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run riscv32imac-demo under QEMU
        working-directory: examples/riscv32imac-demo
        run: |
          cargo qtest --target riscv32imac-unknown-none-elf --verbose

  qemu-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run thumbv7em-demo (fails_on_bug intentionally fails)
        working-directory: examples/thumbv7em-demo
        run: |
          set +e
          cargo qtest > "$RUNNER_TEMP/qtest-demo.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/qtest-demo.log"
          if [ "$status" -eq 0 ]; then
            echo "expected thumbv7em-demo to fail overall (fails_on_bug is intentional)"
            exit 1
          fi
          grep -q "FAILED" "$RUNNER_TEMP/qtest-demo.log"

  thumbv8m-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run thumbv8m-demo (fails_on_bug intentionally fails)
        working-directory: examples/thumbv8m-demo
        run: |
          set +e
          cargo qtest --target thumbv8m.main-none-eabihf > "$RUNNER_TEMP/qtest-v8m.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/qtest-v8m.log"
          if [ "$status" -eq 0 ]; then
            echo "expected thumbv8m-demo to fail overall (fails_on_bug is intentional)"
            exit 1
          fi
          grep -q "FAILED" "$RUNNER_TEMP/qtest-v8m.log"

