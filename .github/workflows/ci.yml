name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run host tests (incl. defmt encode/decode roundtrip)
        run: cargo test --verbose

  dual-demo-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run dual-demo on the std host (qemu-test's libtest-mimic harness)
        working-directory: examples/dual-demo
        run: cargo test --verbose

  dual-demo-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run dual-demo under QEMU (qemu-test's embedded-test harness)
        working-directory: examples/dual-demo
        run: |
          cargo qtest --verbose 2>&1 | tee "$RUNNER_TEMP/qtest-dual.log"
          grep -q "shared_cases" "$RUNNER_TEMP/qtest-dual.log"
          grep -q "overflow_fails" "$RUNNER_TEMP/qtest-dual.log"
          grep -q "result: ok" "$RUNNER_TEMP/qtest-dual.log"

  # Xtensa end-to-end: espressif QEMU (fork, patched) + Espressif Rust toolchain.
  # Mirrors examples/xtensa-esp32-demo's expected flow; skipped if the runner
  # image lacks either piece.
  xtensa-esp32-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for Xtensa
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32
          ldproxy: false
      - name: Install QEMU runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libslirp0
      - name: Cache QEMU Xtensa binary
        id: cache-qemu
        uses: actions/cache@v4
        with:
          path: /opt/qemu-xtensa
          key: qemu-system-xtensa-v0.1.0-noble
      - name: Download prebuilt QEMU Xtensa
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/qemu-xtensa
          curl -sL https://github.com/kokroo/qemu/releases/download/v0.1.0-semihosting/qemu-system-xtensa-esp32.tar.gz | sudo tar -xz -C /opt/qemu-xtensa
          sudo chmod +x /opt/qemu-xtensa/qemu-system-xtensa
      - name: Add QEMU to PATH
        run: echo "/opt/qemu-xtensa" >> "$GITHUB_PATH"
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run xtensa-esp32-demo under QEMU
        working-directory: examples/xtensa-esp32-demo
        env:
          CARGO_UNSTABLE_BUILD_STD: core
          CARGO_UNSTABLE_BUILD_STD_FEATURES: compiler-builtins-mem
        run: |
          cargo qtest --target xtensa-esp32-none-elf --verbose

  qemu-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Install cargo-qtest
        run: cargo install --path .
      - name: Run thumbv7em-demo (fails_on_bug intentionally fails)
        working-directory: examples/thumbv7em-demo
        run: |
          set +e
          cargo qtest > "$RUNNER_TEMP/qtest-demo.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/qtest-demo.log"
          if [ "$status" -eq 0 ]; then
            echo "expected thumbv7em-demo to fail overall (fails_on_bug is intentional)"
            exit 1
          fi
          grep -q "FAILED" "$RUNNER_TEMP/qtest-demo.log"

