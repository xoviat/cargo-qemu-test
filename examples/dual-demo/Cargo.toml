[package]
name = "dual-demo"
version = "0.1.0"
edition = "2021"
publish = false

# One test target, two harnesses:
#   `cargo test`  -> std host run via libtest-mimic (libtest-compatible output)
#   `cargo qtest` -> no_std embedded run via embedded-test under QEMU
[lib]
harness = false

[[test]]
name = "suite"
harness = false

# Target-gated dev-dependencies keep each side's crates off the other side's builds:
# no std-only crates on thumbv7em, no semihosting crates on the host.
# cortex-m-rt is a *regular* (target-gated) dependency: the lib itself uses it
# (`use cortex_m_rt as _;`) even when compiled as a dependency of the test targets.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = "0.7.6"

[target.'cfg(target_os = "none")'.dev-dependencies]
embedded-test = "0.7.2"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
libtest-mimic = "0.8.2"
