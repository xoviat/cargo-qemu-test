[package]
name = "dual-demo"
version = "0.1.0"
edition = "2021"
publish = false

# One suite, written once via qemu-test, run by two commands:
#   `cargo test`  -> std host, libtest-mimic harness (libtest-compatible output)
#   `cargo qtest` -> no_std embedded, embedded-test harness under QEMU
[lib]
harness = false

[[test]]
name = "suite"
harness = false

[dev-dependencies]
# The only harness dependency: embedded-test (QEMU side) and libtest-mimic
# (host side) are both re-exported through this facade.
qemu-test = { path = "../../qemu-test" }

# The firmware runtime (vector table / reset handler) — only the target needs it.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m-rt = "0.7.6"
